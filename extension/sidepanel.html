<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ticket Recommender</title>
  <style>
    body { font-family: sans-serif; font-size: 13px; padding: 12px; width: 320px; }
    #ticket-header { margin-bottom: 12px; }
    #analyze-btn { padding: 6px 12px; cursor: pointer; }
    .step { margin-bottom: 8px; padding: 6px; border-radius: 4px; background: #f5f5f5; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; margin-left: 6px; }
    .badge-supported { background: #d4edda; color: #155724; }
    .badge-inferred { background: #fff3cd; color: #856404; }
    .badge-uncertain { background: #e2e3e5; color: #383d41; }
    #status { color: #666; font-style: italic; }
    .error { color: #a94442; }
  </style>
</head>
<body>
  <div id="ticket-header">Loading ticket...</div>
  <button id="analyze-btn" disabled>Analyze</button>
  <div id="status"></div>
  <div id="result"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
